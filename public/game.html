<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pass the Prop — HackO'Ween</title>
  <meta name="description" content="Pass the Prop number mystery game for HackO'Ween stage projector." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=JetBrains+Mono:wght@700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #09070f;
      --card-bg: rgba(18, 14, 28, 0.82);
      --card-border: rgba(255, 122, 26, 0.28);
      --card-border-active: rgba(255, 122, 26, 0.85);
      --orange: #ff7a1a;
      --orange-glow: rgba(255, 122, 26, 0.5);
      --purple: #a855f7;
      --text-main: #ffffff;
      --text-muted: #9e9aa8;
      --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Anton', 'Bebas Neue', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(168, 85, 247, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 15% 85%, rgba(255, 122, 26, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 85% 85%, rgba(255, 122, 26, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, #150f24 0%, #09070f 85%);
      min-height: 100vh;
      color: var(--text-main);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Ambient background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 1;
    }

    /* Floating Embers Canvas */
    #ember-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* ---- TOP HEADER ---- */
    .top-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 36px;
      width: 100%;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .alta-logo-img {
      height: clamp(36px, 4.2vw, 48px);
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(255, 122, 26, 0.35));
    }

    .page-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 122, 26, 0.14);
      border: 1px solid rgba(255, 122, 26, 0.35);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ff9d4d;
      backdrop-filter: blur(10px);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse-dot 1.8s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    .top-right-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn-round {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(18, 14, 28, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #eae9ed;
      cursor: pointer;
      backdrop-filter: blur(14px);
      transition: all 0.25s ease;
      text-decoration: none;
    }

    .icon-btn-round:hover {
      border-color: var(--orange);
      box-shadow: 0 0 18px var(--orange-glow);
      transform: translateY(-2px) scale(1.06);
      color: #ffffff;
    }

    .icon-svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
    }

    /* ---- MAIN STAGE ARENA ---- */
    .stage-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 10px 28px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
    }

    .headline-wrap {
      text-align: center;
      margin-bottom: 28px;
    }

    .game-supertitle {
      font-size: clamp(0.8rem, 1.3vw, 1.05rem);
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--orange);
      text-shadow: 0 0 14px var(--orange-glow);
      margin-bottom: 8px;
    }

    .game-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 7vw, 5.5rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 40px rgba(255, 122, 26, 0.4);
    }

    /* ---- 3 GIANT PROP NUMBER CARDS ---- */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(18px, 2.8vw, 36px);
      width: 100%;
      margin: 20px 0;
    }

    .prop-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 32px;
      padding: clamp(24px, 3.2vw, 42px) clamp(18px, 2.4vw, 30px);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 122, 26, 0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .prop-card.card-revealed-active {
      border-color: var(--card-border-active);
      box-shadow: 0 35px 85px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 122, 26, 0.3);
      transform: translateY(-4px);
    }

    .card-top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-tag {
      font-size: clamp(0.85rem, 1.2vw, 1.15rem);
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--orange);
    }

    /* Digit slots container */
    .digits-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(10px, 1.5vw, 18px);
      width: 100%;
    }

    /* Single Digit Slot */
    .digit-slot {
      aspect-ratio: 1 / 1.45;
      background: rgba(8, 6, 14, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.28s ease;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    /* Scanlines */
    .digit-slot::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.02) 0px,
        rgba(255, 255, 255, 0.02) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
    }

    .digit-slot.is-revealed {
      border-color: var(--orange);
      background: radial-gradient(circle at 50% 40%, rgba(255, 122, 26, 0.25) 0%, rgba(8, 6, 14, 0.95) 85%);
      box-shadow: 0 0 30px var(--orange-glow), inset 0 0 18px rgba(255, 122, 26, 0.3);
      transform: scale(1.03);
    }

    .digit-char {
      font-family: var(--font-mono);
      font-size: clamp(3rem, 5.8vw, 5.8rem);
      font-weight: 800;
      color: #3b3745;
      line-height: 1;
      text-shadow: none;
      transition: all 0.25s ease;
      user-select: none;
    }

    .digit-slot.is-revealed .digit-char {
      color: #ffffff;
      text-shadow: 0 0 25px #ff852e, 0 0 50px rgba(255, 122, 26, 0.9);
      animation: digit-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes digit-pop {
      0% { transform: scale(0.65); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .slot-index {
      position: absolute;
      bottom: 8px;
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: rgba(255, 255, 255, 0.25);
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 900px) {
      .cards-grid {
        grid-template-columns: 1fr;
        max-width: 540px;
      }
      .digit-char {
        font-size: 3.6rem;
      }
      .top-header {
        padding: 16px 20px;
      }
    }

    @media (max-width: 600px) {
      .digit-char {
        font-size: 2.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Embers Canvas -->
  <canvas id="ember-canvas"></canvas>

  <!-- TOP HEADER -->
  <header class="top-header">
    <div class="brand-left">
      <a href="/" title="Back to HackO'Ween Countdown">
        <img id="alta-logo" src="alta-logo-light.png" alt="ALTA School of Technology Logo" class="alta-logo-img" />
      </a>
    </div>

    <div class="top-right-bar">
      <!-- Fullscreen Toggle -->
      <button id="fullscreen-btn" class="icon-btn-round" type="button" title="Toggle Fullscreen (F)">
        <svg id="fs-icon-enter" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <svg id="fs-icon-exit" class="icon-svg" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
        </svg>
      </button>

      <!-- Return to Timer -->
      <a href="/" class="icon-btn-round" title="Go to Main Countdown Timer">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </a>
    </div>
  </header>

  <!-- MAIN STAGE ARENA -->
  <main class="stage-container">


    <!-- 3 GIANT CARDS GRID -->
    <div class="cards-grid">

      <!-- Card 1 -->
      <div class="prop-card" id="card-0">
        <div class="card-top-bar">
          <div class="card-tag">PROP #1</div>
        </div>
        <div class="digits-row">
          <div class="digit-slot" id="slot-0-0"><span class="digit-char" id="char-0-0">—</span><span class="slot-index">POS 1</span></div>
          <div class="digit-slot" id="slot-0-1"><span class="digit-char" id="char-0-1">—</span><span class="slot-index">POS 2</span></div>
          <div class="digit-slot" id="slot-0-2"><span class="digit-char" id="char-0-2">—</span><span class="slot-index">POS 3</span></div>
          <div class="digit-slot" id="slot-0-3"><span class="digit-char" id="char-0-3">—</span><span class="slot-index">POS 4</span></div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="prop-card" id="card-1">
        <div class="card-top-bar">
          <div class="card-tag">PROP #2</div>
        </div>
        <div class="digits-row">
          <div class="digit-slot" id="slot-1-0"><span class="digit-char" id="char-1-0">—</span><span class="slot-index">POS 1</span></div>
          <div class="digit-slot" id="slot-1-1"><span class="digit-char" id="char-1-1">—</span><span class="slot-index">POS 2</span></div>
          <div class="digit-slot" id="slot-1-2"><span class="digit-char" id="char-1-2">—</span><span class="slot-index">POS 3</span></div>
          <div class="digit-slot" id="slot-1-3"><span class="digit-char" id="char-1-3">—</span><span class="slot-index">POS 4</span></div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="prop-card" id="card-2">
        <div class="card-top-bar">
          <div class="card-tag">PROP #3</div>
        </div>
        <div class="digits-row">
          <div class="digit-slot" id="slot-2-0"><span class="digit-char" id="char-2-0">—</span><span class="slot-index">POS 1</span></div>
          <div class="digit-slot" id="slot-2-1"><span class="digit-char" id="char-2-1">—</span><span class="slot-index">POS 2</span></div>
          <div class="digit-slot" id="slot-2-2"><span class="digit-char" id="char-2-2">—</span><span class="slot-index">POS 3</span></div>
          <div class="digit-slot" id="slot-2-3"><span class="digit-char" id="char-2-3">—</span><span class="slot-index">POS 4</span></div>
        </div>
      </div>

    </div>

  </main>

  <script>
    /* ─── Secret Codes ─── */
    const NUMBERS = ["4821", "7394", "1608"];

    /**
     * CRITICAL RULE: EXACTLY 2 DIGITS IN TOTAL ACROSS THE ENTIRE SCREEN AT ANY TIME!
     * Format: [ [card0_slots], [card1_slots], [card2_slots] ]
     * In every single state: length(card0) + length(card1) + length(card2) === 2
     */
    const STATES_SEQUENCE = [
      // State 1: Card 1 has '4' and '8' at positions 0 and 1; Cards 2 & 3 completely hidden
      [[0, 1], [], []],

      // State 2: Card 2 has '7' and '3' at positions 0 and 1; Cards 1 & 3 completely hidden
      [[], [0, 1], []],

      // State 3: Card 3 has '1' and '6' at positions 0 and 1; Cards 1 & 2 completely hidden
      [[], [], [0, 1]],

      // State 4: Card 1 has '8' (pos 1), Card 3 has '0' (pos 2); Card 2 hidden
      [[1], [], [2]],

      // State 5: Card 1 has '2' and '1' at positions 2 and 3; Cards 2 & 3 hidden
      [[2, 3], [], []],

      // State 6: Card 2 has '9' and '4' at positions 2 and 3; Cards 1 & 3 hidden
      [[], [2, 3], []],

      // State 7: Card 3 has '0' and '8' at positions 2 and 3; Cards 1 & 2 hidden
      [[], [], [2, 3]],

      // State 8: Card 2 has '3' (pos 1), Card 3 has '8' (pos 3); Card 1 hidden
      [[], [1], [3]],

      // State 9: Card 1 has '4' (pos 0) and '1' (pos 3); Cards 2 & 3 hidden
      [[0, 3], [], []],

      // State 10: Card 2 has '7' (pos 0) and '4' (pos 3); Cards 1 & 3 hidden
      [[], [0, 3], []],

      // State 11: Card 1 has '4' (pos 0), Card 2 has '7' (pos 0); Card 3 hidden
      [[0], [0], []],

      // State 12: Card 3 has '1' (pos 0) and '8' (pos 3); Cards 1 & 2 hidden
      [[], [], [0, 3]]
    ];

    let currentIndex = 0;
    const LOOP_INTERVAL = 1100; // 2x speed (1.1s between reveals)

    /* ─── Render State onto Screen ─── */
    function renderState(pattern) {
      for (let c = 0; c < 3; c++) {
        const cardEl = document.getElementById(`card-${c}`);
        const rawCode = NUMBERS[c];
        const cardReveals = pattern[c] || [];
        const hasReveals = cardReveals.length > 0;

        cardEl.classList.toggle('card-revealed-active', hasReveals);

        for (let s = 0; s < 4; s++) {
          const slotEl = document.getElementById(`slot-${c}-${s}`);
          const charEl = document.getElementById(`char-${c}-${s}`);
          const isRevealed = cardReveals.includes(s);

          if (isRevealed) {
            charEl.textContent = rawCode[s];
            slotEl.className = 'digit-slot is-revealed';
          } else {
            charEl.textContent = '—';
            slotEl.className = 'digit-slot';
          }
        }
      }
    }

    function advanceStep() {
      currentIndex = (currentIndex + 1) % STATES_SEQUENCE.length;
      renderState(STATES_SEQUENCE[currentIndex]);
    }

    // Auto-advance loop
    renderState(STATES_SEQUENCE[0]);
    setInterval(advanceStep, LOOP_INTERVAL);

    /* ─── Embers Canvas Background ─── */
    (function initEmbers() {
      const canvas = document.getElementById('ember-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      const particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: Math.random() * 2.5 + 1,
          speedY: Math.random() * 0.6 + 0.2,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.6 + 0.2,
          color: Math.random() > 0.4 ? '#ff7a1a' : '#a855f7'
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.opacity;
          ctx.shadowBlur = 8;
          ctx.shadowColor = p.color;
          ctx.fill();

          p.y -= p.speedY;
          p.x += p.speedX;
          if (p.y < -10) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ─── Fullscreen Controller ─── */
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fsIconEnter   = document.getElementById('fs-icon-enter');
    const fsIconExit    = document.getElementById('fs-icon-exit');

    function isFullscreen() {
      return Boolean(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    async function toggleFullscreen() {
      try {
        if (!isFullscreen()) {
          const el = document.documentElement;
          if (el.requestFullscreen) await el.requestFullscreen();
          else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
        }
      } catch (e) {}
    }

    function updateFullscreenUI() {
      const active = isFullscreen();
      fsIconEnter.style.display = active ? 'none' : 'block';
      fsIconExit.style.display = active ? 'block' : 'none';
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFullscreenUI);

    // Keyboard shortcut 'F'
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      }
    });
  </script>
</body>
</html>
